name: Release

# Push a tag like v0.1.0 (or run it by hand from the Actions tab) to build every
# platform and attach the bundles to a draft GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-Apple-Silicon
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS-Intel
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: FlopGPT v__VERSION__
          releaseDraft: true
          generateReleaseNotes: true
          # Plain-English names, e.g. FlopGPT_0.1.0_macOS-Apple-Silicon.dmg
          assetNamePattern: FlopGPT_[version]_${{ matrix.label }}[setup][ext]
          releaseBody: |
            ## Which file do I download?

            | Your computer | Download |
            |---|---|
            | **Mac with Apple Silicon** (M1, M2, M3, M4 — most Macs from late 2020 on) | `…_macOS-Apple-Silicon.dmg` |
            | **Mac with Intel** (older Macs) | `…_macOS-Intel.dmg` |
            | **Windows** | `…_Windows-setup.exe` |
            | **Linux** | `…_Linux.AppImage` works on most distros. Use `.deb` for Ubuntu/Debian or `.rpm` for Fedora. |

            Not sure which Mac you have? Click the Apple menu, then **About This Mac**. If it lists a **Chip**, pick Apple Silicon. If it lists a **Processor**, pick Intel.

            You can ignore the `.app.tar.gz` and `.msi` files.
          args: --target ${{ matrix.target }}
